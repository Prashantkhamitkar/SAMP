# ══════════════════════════════════════════
# Server
# ══════════════════════════════════════════
server.port=8080
server.servlet.context-path=/api

# ══════════════════════════════════════════
# Database
# ══════════════════════════════════════════
spring.datasource.url=jdbc:mysql://localhost:3306/samp_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ══════════════════════════════════════════
# JWT
# ══════════════════════════════════════════
app.jwt.secret=4b3c2a1d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b
app.jwt.expiration-ms=86400000

# ══════════════════════════════════════════
# Swagger
# ══════════════════════════════════════════
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ══════════════════════════════════════════
# Actuator
# ══════════════════════════════════════════
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ══════════════════════════════════════════
# Logging
# ══════════════════════════════════════════
logging.level.com.samp=DEBUG
logging.level.org.springframework.security=INFO